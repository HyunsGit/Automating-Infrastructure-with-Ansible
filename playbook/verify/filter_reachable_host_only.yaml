- name: Filter reachable hosts
  hosts: all
  become: true
  gather_facts: no
  tasks:
    - name: Test connectivity
      ansible.builtin.ping:
      register: ping_result
      ignore_errors: yes

    - name: Add reachable hosts to a new inventory file
      ansible.builtin.lineinfile:
        path: /etc/ansible/inventory/reachable_inventory.ini
        line: "{{ inventory_hostname }}"
        create: yes
      when: ping_result is not failed

    - name: Store reachable hosts in a dictionary
      ansible.builtin.set_fact:
        reachable_hosts: "{{ reachable_hosts | default({}) | combine({group_names[0]: (reachable_hosts[group_names[0]] | default([])) + [inventory_hostname]}) }}"
      when: ping_result is not failed and group_names | length > 0

    - name: Write groups and hosts to the new inventory
      ansible.builtin.blockinfile:
        path: /etc/ansible/inventory/reachable_inventory.ini
        marker: "# {mark} ANSIBLE MANAGED BLOCK"
        block: |
          [{% for group, hosts in reachable_hosts.items() %}
          {{ group }}
          {% for host in hosts %}
          {{ host }}
          {% endfor %}
          {% endfor %}

