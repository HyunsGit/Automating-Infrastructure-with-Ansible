---
- name: VM DNS Table - Perfect Clean
  hosts: all
  gather_facts: yes
  become: yes

  tasks:
    - name: Smart DNS collection (no dups)
      shell: |
        if command -v resolvectl >/dev/null 2>&1; then
          CURRENT=$(resolvectl status 2>/dev/null | grep 'Current DNS Server' | awk '{print $NF}' | head -1)
          SERVERS=$(resolvectl status 2>/dev/null | grep -oE '[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}' | grep -v "^$CURRENT$" | head -3 | paste -sd ',' || echo "")
          echo "CURRENT_DNS: $CURRENT"
          echo "ALL_DNS: $SERVERS"
        else
          ALL=$(nmcli dev show 2>/dev/null | grep IP4.DNS | awk '{print $NF}' | head -4)
          CURRENT=$(echo "$ALL" | head -1)
          SERVERS=$(echo "$ALL" | tail -n +2 | head -3 | paste -sd ',')
          echo "CURRENT_DNS: $CURRENT"
          echo "ALL_DNS: $SERVERS"
        fi
        
        OS=$(grep '^PRETTY_NAME=' /etc/os-release 2>/dev/null | cut -d'=' -f2 | tr -d '"' || echo "$(hostnamectl | grep 'Operating System' | cut -d':' -f2- | xargs)")
        echo "OS: $OS"
      register: dns_os
      changed_when: false

    - name: Parse clean values
      set_fact:
        os_clean: "{{ dns_os.stdout | regex_search('OS:\\s*(.+)') | regex_replace('OS: ', '') | trim }}"
        current_clean: "{{ dns_os.stdout | regex_search('CURRENT_DNS:\\s*([0-9\\.]+)') | regex_replace('CURRENT_DNS: ', '') | trim }}"
        dns_servers: "{{ dns_os.stdout | regex_search('ALL_DNS:\\s*([^\\n]+)') | regex_replace('ALL_DNS: ', '') | split(',') | select | reject('equalto', '') | list }}"

    - name: Debug final table (perfect)
      debug:
        msg: "{{ inventory_hostname }} | {{ os_clean }} | {{ current_clean }} | {{ dns_servers | join(' | ') }}"

  post_tasks:
    - name: Save perfect table
      lineinfile:
        path: /tmp/vm_dns_table.csv
        line: "{{ inventory_hostname }},{{ os_clean }},{{ current_clean }},{{ dns_servers | join(',') }}"
        create: yes
      delegate_to: localhost

    - name: Header
      copy:
        dest: /tmp/vm_dns_table.csv
        content: "hostname | OS | current dns | dns #1 | dns#2 | dns#3\n"
        force: no
      delegate_to: localhost
      run_once: true
