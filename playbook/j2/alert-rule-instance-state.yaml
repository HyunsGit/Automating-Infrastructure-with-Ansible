---
- name: Template for Creating Rule Set for AlertManager
  hosts: all
  become: true
  gather_facts: true
  tasks:
  - name: Create AlertManager Rule Set
    template:
      src: /etc/ansible/templates/instance_state_alert_rule.conf.j2
      dest: /etc/prometheus/instance_state_rules.yml
    delegate_to: infra-prometheus-01
    ignore_errors: true

