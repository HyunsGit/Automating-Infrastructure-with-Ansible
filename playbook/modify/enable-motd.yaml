---
- name: enable message of the day(U68)
  hosts: all
  become: true
  tasks:
    - name: append motd content(U68-3)
      blockinfile: 
            path: /etc/issue
            block: |
                ----------   ----    ---- ------------ ------------ ------------ ----    ---- --------  ----    ----
                ************ ****   ****  ************ ************ ************ ****    **** ********  *****   ****
                --        -- ----  ----   ------------ ----         ---          ----    ----   ----    ------  ----
                **        ** *********        ****     ************ ***          ************   ****    ************
                --        -- ---------        ----     ------------ ---          ------------   ----    ------------
                **        ** ****  ****       ****     ****         ***          ****    ****   ****    ****  ******
                ------------ ----   ----      ----     ------------ ------------ ----    ---- --------  ----   -----
                ####################################################################################################
                                            인가되지 않은 사용자의 접근 시 처벌을 받을 수 있습니다.
                                                      지정된 이용자만 접근 부탁드립니다.
                                                            @example.com
                ####################################################################################################
    - name: restart sshd
      ansible.builtin.systemd:
        state: restarted
        name: sshd